<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAPPA | Research Workbench</title><style>
:root{--bg:#071412;--panel:#0d201c;--panel2:#102823;--line:#1e3e35;--mint:#60e0b0;--cyan:#7edbea;--text:#e9f6f0;--muted:#91aaa0;--gold:#d8c384;--red:#e69785}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 70% -20%,#163a30 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:24px 16px;background:#081713;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin-bottom:32px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#58e0ad,#2a9b80);display:grid;place-items:center;color:#062118;font-weight:900;font-size:17px;box-shadow:0 8px 28px #50d5a733}.brand b{font-size:18px;letter-spacing:.17em}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.06em}.section-label{font-size:10px;letter-spacing:.15em;color:#718d82;margin:17px 10px 8px;text-transform:uppercase}.nav{width:100%;text-align:left;border:0;color:#99b0a6;background:transparent;border-radius:9px;padding:10px 11px;margin:2px 0;cursor:pointer;font:inherit}.nav:hover,.nav.active{background:#153129;color:#dff8ed}.nav.active{box-shadow:inset 2px 0 var(--mint)}.sidefoot{position:absolute;bottom:18px;color:#6e897f;font-size:11px;padding:0 8px}.main{min-width:0}.top{height:72px;display:flex;justify-content:space-between;align-items:center;padding:0 34px;border-bottom:1px solid #18362e;background:#071713cc}.crumb{color:#8da99c;font-size:12px}.status{border:1px solid #23533f;color:#95e4bc;background:#102a21;border-radius:30px;padding:6px 11px;font-size:11px;display:flex;gap:7px;align-items:center}.dot{width:7px;height:7px;border-radius:50%;background:#65e4a4;box-shadow:0 0 10px #65e4a4}.content{padding:30px 34px;max-width:1500px;margin:auto}.eyebrow{font-size:10px;color:var(--mint);letter-spacing:.18em;text-transform:uppercase;font-weight:700}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin:7px 0 23px}.hero h1{font-weight:550;font-size:30px;line-height:1.18;margin:6px 0}.hero p{margin:7px 0 0;color:var(--muted);max-width:740px}.tag{border:1px solid var(--line);border-radius:20px;color:#a9c2b7;padding:6px 10px;font-size:11px;white-space:nowrap}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(120px,1fr));margin-bottom:15px}.card{background:linear-gradient(145deg,#0e211c,#0b1b18);border:1px solid var(--line);border-radius:13px;padding:17px;min-width:0}.statlabel{color:#8da89d;font-size:11px}.stat{font-size:27px;letter-spacing:-.04em;margin:7px 0 2px;font-weight:620}.statnote{font-size:10px;color:#6f8b80}.twocol{grid-template-columns:1.2fr .8fr}.three{grid-template-columns:repeat(3,1fr)}h2{font-size:15px;font-weight:600;margin:0 0 4px}.sub{color:var(--muted);font-size:11px;margin-bottom:13px}.pill{display:inline-block;background:#133227;color:#9fe9c4;padding:3px 8px;border-radius:20px;font-size:10px;margin:2px}.pill.blue{background:#132e36;color:#88d7e5}.pill.gold{background:#332d1a;color:#dbc781}.tablewrap{overflow:auto;max-height:430px;border:1px solid #1b3730;border-radius:9px}table{border-collapse:collapse;width:100%;font-size:11px}th{position:sticky;top:0;background:#11251f;color:#88a89b;text-align:left;font-weight:550;padding:10px;white-space:nowrap}td{border-top:1px solid #19352e;padding:9px 10px;color:#d3e4dc;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}tr:hover td{background:#102820}.button{background:#57d7a5;color:#07231a;border:0;border-radius:7px;padding:9px 13px;font:inherit;font-weight:650;cursor:pointer}.button.secondary{background:#152b25;color:#b4cec2;border:1px solid var(--line)}input,select,textarea{background:#081915;color:var(--text);border:1px solid #295044;border-radius:7px;padding:10px;font:inherit;outline:none}input:focus,textarea:focus{border-color:var(--mint)}.row{display:flex;gap:8px;align-items:center}.grow{flex:1}.callout{padding:12px 14px;border:1px solid #475035;background:#252619;border-radius:9px;color:#d6c986;font-size:11px}.muted{color:var(--muted)}.mono{font:12px ui-monospace,SFMono-Regular,monospace;word-break:break-all;color:#bdebd7}.graphbox{height:400px;overflow:hidden;background:radial-gradient(ellipse,#10261e,#091612);border-radius:10px}.graphbox svg{width:100%;height:100%}.feature{display:grid;grid-template-columns:minmax(112px,34%) minmax(0,1fr);gap:10px;align-items:start;padding:8px 0;border-bottom:1px solid #1c3730}
.feature>span{color:#9bb4a8;font-size:12px;line-height:1.35;overflow-wrap:anywhere}
.feature>b{text-align:right;font-weight:600;font-size:12.5px;line-height:1.4;overflow-wrap:anywhere;min-width:0}.bar{height:5px;border-radius:5px;background:#18342b;overflow:hidden;width:100px}.bar i{display:block;background:var(--mint);height:100%}.detail{display:grid;grid-template-columns:1fr 1fr;gap:9px}.detail div{background:#0a1b17;border:1px solid #1a342d;border-radius:7px;padding:10px}.detail small{display:block;color:#88a296;font-size:10px}.detail b{font-size:13px}.hide{display:none!important}.split{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.footer-note{font-size:10px;color:#668277;margin-top:12px}.empty{padding:32px;text-align:center;color:#829b90}.metricline{display:flex;gap:22px;flex-wrap:wrap}.metricline span{color:#89a69a;font-size:11px}.metricline b{color:#dcefe5;font-size:15px;display:block;margin-top:3px}pre{white-space:pre-wrap;overflow:auto;color:#a9c5b9;font-size:11px}@media(max-width:900px){.app{grid-template-columns:68px 1fr}.side{padding:18px 8px}.brand{justify-content:center}.brand>div:nth-child(2),.nav span,.section-label,.sidefoot{display:none}.nav{text-align:center;font-size:0;padding:12px}.nav:before{content:attr(data-icon);font-size:16px}.content{padding:22px 17px}.top{padding:0 18px}.stats{grid-template-columns:repeat(2,1fr)}.twocol,.split{grid-template-columns:1fr}}@media(max-width:560px){.three{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.stats{gap:8px}.stat{font-size:22px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">κ</div><div><b>KAPPA</b><small>PHYTO-PHARMACOGENOMICS</small></div></div><div class="section-label">Research workspace</div><button class="nav active" data-page="overview" title="Research overview" aria-label="Research overview" data-icon="⌂"><span>⌂ &nbsp; Overview</span></button><button class="nav" data-page="ethnobotany" title="Plant & knowledge explorer" aria-label="Plant & knowledge explorer" data-icon="♧"><span>♧ &nbsp; Plant & knowledge</span></button><button class="nav" data-page="compounds" title="Compound explorer" aria-label="Compound explorer" data-icon="◈"><span>◈ &nbsp; Compound explorer</span></button><button class="nav" data-page="genomics" title="Genomic context" aria-label="Genomic context" data-icon="⌬"><span>⌬ &nbsp; Genomic context</span></button><div class="section-label">Analysis</div><button class="nav" data-page="ml" title="Machine-learning laboratory" aria-label="Machine-learning laboratory" data-icon="⟡"><span>⟡ &nbsp; ML laboratory</span></button><button class="nav" data-page="graph" title="Evidence graph" aria-label="Evidence graph" data-icon="⋈"><span>⋈ &nbsp; Evidence graph</span></button><button class="nav" data-page="rank" title="Candidate prioritisation" aria-label="Candidate prioritisation" data-icon="↗"><span>↗ &nbsp; Prioritisation</span></button><div class="section-label">Project</div><button class="nav" data-page="methods" title="Methods & evidence" aria-label="Methods & evidence" data-icon="≡"><span>≡ &nbsp; Methods & evidence</span></button><div class="sidefoot">ETHNOHACK 2026 · Research prototype<br>Not for clinical use</div></aside><main class="main"><header class="top"><div class="crumb">KAPPA <span style="color:#3c6153">/</span> <span id="crumb">Research overview</span></div><div class="status"><i class="dot"></i> Reproducible pipeline · data cached</div></header><div class="content" id="view"></div></main></div><script>
const $=s=>document.querySelector(s);let overview={}, compoundRows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const views={overview:['Research overview',overviewPage],ethnobotany:['Plant & knowledge explorer',plantPage],compounds:['Compound explorer',compoundPage],genomics:['Genomic context',genomicsPage],ml:['Machine-learning laboratory',mlPage],graph:['Evidence graph',graphPage],rank:['Candidate prioritisation',rankPage],methods:['Methods & evidence',methodsPage]};
function head(tag,title,desc){return `<div class="hero"><div><div class="eyebrow">${tag}</div><h1>${title}</h1><p>${desc}</p></div></div>`}
function metricCard(label,value,note){return `<div class="card"><div class="statlabel">${label}</div><div class="stat">${value}</div><div class="statnote">${note}</div></div>`}
async function loadData(){try{overview=await (await fetch('/api/overview')).json();compoundRows=await (await fetch('/api/compounds')).json()}catch(e){console.warn(e)}render('overview')}
function overviewPage(){let m=overview.metrics||{},rf=m.primary_models?.['Random forest']||{};return `${head('Knowledge-guided AI for phyto-pharmacogenomic assessment','From plant knowledge to testable hypotheses.','An evidence-aware research workbench that brings natural-product chemistry and measured target bioactivity into one traceable, reproducible workflow.')}<div class="grid stats">${metricCard('Curated assay records',(overview.records||0).toLocaleString(),'Human PTGS2 IC50 · ChEMBL')}${metricCard('Scaffold test ROC-AUC',rf.roc_auc?.toFixed(3)||'—','Held-out chemical scaffolds')}${metricCard('Plant anchor','1','Curcuma longa L.')}${metricCard('Measured target','PTGS2','Human COX-2 · CHEMBL230')}</div><div class="grid twocol"><div class="card"><h2>Research path</h2><div class="sub">Where evidence meets modelling—and where it stops.</div><div class="detail"><div><small>01 · Biological occurrence</small><b>Plant ↔ compound</b><div class="sub">Reported natural product occurrence, source-linked</div></div><div><small>02 · Chemical identity</small><b>Structure & identifiers</b><div class="sub">Canonical SMILES, descriptors, fingerprint</div></div><div><small>03 · Experimental labels</small><b>ChEMBL IC₅₀</b><div class="sub">Human PTGS2 biochemical assays</div></div><div><small>04 · Computational output</small><b>Scaffold-aware ML</b><div class="sub">Uncalibrated activity estimate + nearest-training similarity</div></div></div><div class="footer-note">Ethnobotanical therapeutic claims are intentionally not inferred from natural-product occurrence.</div></div><div class="card"><h2>Prototype focus</h2><div class="sub">Feasibility-led pilot scope</div><div class="feature"><span class="muted">Botanical anchor</span><b>Curcuma longa L.</b></div><div class="feature"><span class="muted">Illustrative phytochemical</span><b>Curcumin · PubChem 969516</b></div><div class="feature"><span class="muted">Model endpoint</span><b>PTGS2 IC₅₀ activity bands</b></div><div class="feature"><span class="muted">Scope boundary</span><b>Biochemical assay only</b></div><div class="callout" style="margin-top:13px">Predictions prioritise experiments; they do not establish inhibition, therapeutic benefit, safety, or clinical response.</div></div></div><div class="grid twocol" style="margin-top:14px"><div class="card"><h2>Model snapshot</h2><div class="sub">Random forest · scaffold-held-out test set</div><div class="metricline">${['ROC-AUC','PR-AUC','Precision','Recall','F1'].map((x,i)=>`<span>${x}<b>${[rf.roc_auc,rf.pr_auc,rf.precision_at_0_5,rf.recall_at_0_5,rf.f1_at_0_5][i]?.toFixed(3)||'—'}</b></span>`).join('')}</div><div style="margin-top:14px"><img src="/results/figures/model_comparison.png" style="width:100%;max-height:210px;object-fit:contain;border:1px solid #1e3e35;border-radius:8px" alt="Actual scaffold test model ROC-AUC comparison"></div></div><div class="card"><h2>Evidence types</h2><div class="sub">Source and inference remain visibly separate</div><p><span class="pill">OBSERVED</span> Recorded ChEMBL assay values and source IDs</p><p><span class="pill blue">CURATED IDENTITY</span> Compound, target and taxonomy identifiers</p><p><span class="pill gold">COMPUTED</span> Model-only triage score (uncalibrated)</p><div class="callout">The CYP2C19–clopidogrel guideline demo is a separate evidence component; it is not linked to curcumin/PTGS2 and contains no patient genotype.</div></div></div>`}
function plantPage(){return `${head('Ethnobotany · pilot record','A plant anchor, not an efficacy claim.','The pilot now shows an occurrence statement and one separately sourced, secondary ethnomedicinal report, with source and context gaps kept explicit.')}<div class="grid twocol"><div class="card"><h2>Curcuma longa L.</h2><div class="sub">Turmeric · accepted scientific name; taxonomic identity should be resolved against current botanical authorities in a full deployment.</div><div class="feature"><span class="muted">Entity type</span><b>Medicinal plant context</b></div><div class="feature"><span class="muted">Occurrence link</span><b>Curcumin</b></div><div class="feature"><span class="muted">Source relationship</span><b>Wikidata P703 occurrence statement</b></div><p class="footer-note">Wikidata Q312266 (curcumin) has a P703 “found in taxon” statement to Q42562 (Curcuma longa), checked via SPARQL on 2026-11-05. It is occurrence evidence only. A separate plant-level use report is recorded below and is not linked mechanistically to curcumin.</p></div><div class="card"><h2>Evidence record</h2><div class="sub">Secondary-source report with context and limits retained</div><div class="callout">Velayudhan et al. (2012) report a cough/cold practice using fresh turmeric powder with warm milk and inhalation of smoke from dried rhizome. Their table cites a Malayalam source (Namboodiri, 2004); exact community/locality are not specified for this entry, and the underlying book was not independently accessed. This is not efficacy or safety evidence.</div><p><a class="muted" href="https://nopr.niscpr.res.in/bitstream/123456789/14954/1/IJTK%2011(4)%20607-614.pdf" target="_blank" rel="noreferrer">Read source paper · Velayudhan et al., 2012</a></p><p><span class="pill">Occurrence ≠ use</span><span class="pill gold">Use ≠ efficacy</span></p><p class="muted">To expand: ingest licensed ethnobotanical literature/database records with source-level citation, community context and access controls preserved.</p></div></div><div class="card" style="margin-top:14px"><h2>Evidence development status</h2><div class="tablewrap"><table><thead><tr><th>Claim type</th><th>Status</th><th>Interpretation</th></tr></thead><tbody><tr><td>Plant–compound occurrence</td><td><span class="pill">Wikidata occurrence statement; source references preserved on item</span></td><td>Organism occurrence is not proof of medicinal use</td></tr><tr><td>Traditional-use literature report</td><td><span class="pill">Secondary report · Velayudhan et al. 2012</span></td><td>Source attributes table to Malayalam book; locality/community unspecified; no efficacy inferred</td></tr><tr><td>Clinical efficacy/safety</td><td><span class="pill gold">Not evaluated</span></td><td>Outside project scope</td></tr></tbody></table></div></div>`}
function fmtNm(v){let x=Number(v);if(!isFinite(x))return 'n/a';if(x===0)return '0';if(x<1)return x.toPrecision(2).replace(/0+$/,'').replace(/\.$/,'');if(x<10)return (Math.round(x*100)/100).toString();if(x<1000)return (Math.round(x*10)/10).toString();return Math.round(x).toLocaleString()}
function compoundPage(){return `${head('Cheminformatics · live records','Explore measured molecules.','Search the curated ChEMBL human PTGS2 dataset. Select a structure for descriptors, or submit a SMILES string to the trained model.')}<div class="card"><div class="row"><input class="grow" id="search" placeholder="Search ChEMBL ID or canonical SMILES…"><a class="button secondary" href="/api/export">Download CSV</a></div><div class="sub" style="margin-top:10px">${compoundRows.length||'…'} records exposed by the API cache (first ${Math.min(compoundRows.length||0,200)} listed) · structure canonicalised and exact duplicates removed before split</div><div class="tablewrap"><table><thead><tr><th>ChEMBL compound</th><th>IC₅₀ (nM)</th><th>Band</th><th>Assay / record</th><th>Canonical SMILES</th><th></th></tr></thead><tbody id="ctable"></tbody></table></div></div><div class="grid twocol" style="margin-top:14px"><div class="card"><h2>Selected structure</h2><div class="sub">Canonical structure identity and RDKit descriptors</div><div id="structure" class="empty">Select a row above to inspect its canonical SMILES and descriptors.</div></div><div class="card"><h2>Try an SMILES prediction</h2><div class="sub">Example: curcumin · target-specific activity classification</div><div class="row"><input id="smiles" class="grow" value="COc1cc(/C=C/C(=O)CC(=O)/C=C/c2ccc(O)c(OC)c2)ccc1O"><button class="button" onclick="predict()">Predict</button></div><div id="prediction"></div></div></div>`}
function fillTable(q=''){let rows=compoundRows.filter(r=>!q||(r.molecule_chembl_id+' '+r.canonical_smiles).toLowerCase().includes(q.toLowerCase())).slice(0,200);$('#ctable').innerHTML=rows.map((r,i)=>`<tr onclick="inspect(${i})"><td>${esc(r.molecule_chembl_id)}</td><td>${fmtNm(r.ic50_nM)}</td><td><span class="pill ${r.label?'':'gold'}">${r.label?'≤ 1 µM activity':'≥ 10 µM band'}</span></td><td>${esc(r.assay_chembl_id)} · ${r.activity_id}</td><td>${esc(r.canonical_smiles)}</td><td>↗</td></tr>`).join('');window.shown=rows}
window.inspect=async i=>{let r=window.shown[i];let d=await fetch('/api/compounds?q='+encodeURIComponent(r.molecule_chembl_id)).then(x=>x.json()).then(a=>a[0]);$('#structure').innerHTML=`<img src="/api/structure?smiles=${encodeURIComponent(d.canonical_smiles)}" alt="RDKit 2D chemical structure" style="width:100%;max-height:235px;object-fit:contain;background:#fff;border-radius:8px;padding:8px"><div class="mono" style="margin-top:9px">${esc(d.canonical_smiles)}</div><div class="detail" style="margin-top:12px">${[['Formula',d.formula],['MW',d.mw],['LogP',d.logp],['TPSA',d.tpsa],['HBD / HBA',d.hbd+' / '+d.hba],['Rotatable bonds',d.rotatable_bonds]].map(x=>`<div><small>${x[0]}</small><b>${x[1]??'—'}</b></div>`).join('')}</div><div class="footer-note">RDKit-rendered 2D depiction from the canonical SMILES; the depiction is a drawing, not experimental evidence.</div>`;$('#smiles').value=d.canonical_smiles};
async function predict(){let box=$('#prediction');box.innerHTML='<p class="muted">Computing…</p>';try{let r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({smiles:$('#smiles').value})});let d=await r.json();if(!r.ok)throw Error(d.detail);box.innerHTML=`<div class="card" style="margin-top:12px"><div class="feature"><span>Uncalibrated activity-band estimate</span><b>${(d.probability_active*100).toFixed(1)}%</b></div><div class="feature"><span>Maximum training Tanimoto · diagnostic only</span><b>${d.max_training_similarity.toFixed(3)}</b></div><div class="feature"><span>Applicability domain</span><b>${d.exact_training_match?'Known training compound · retrospective':d.in_domain?'Within empirical reference range':'Outside empirical range · triage withheld'}</b></div><div class="feature"><span>Model-only triage</span><b>${d.score.candidate_priority_score===null?'Withheld outside empirical reference range':d.score.candidate_priority_score.toFixed(3)}</b></div><div class="feature"><span>Chemical identity</span><b>${esc(d.score.chemical_identity.status)}</b></div><div class="feature"><span>Measured PTGS2 record</span><b>${esc(d.score.observed_bioactivity.status)}${d.score.observed_bioactivity.ic50_nM?` · IC₅₀ ${d.score.observed_bioactivity.ic50_nM} nM · activity ${d.score.observed_bioactivity.activity_id}`:''}</b></div><div class="feature"><span>PGx / plant context</span><b>${esc(d.score.pharmacogenomic_evidence.status)} · ${esc(d.score.ethnobotanical_evidence.status)}</b></div><div class="detail" style="margin-top:9px">${Object.entries(d.properties).filter(([k])=>k!=='canonical_smiles').map(x=>`<div><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div><div class="footer-note">Nearest measured training examples (local context, not causal explanation): ${d.nearest_training_examples.map(n=>`${esc(n.chembl_id)} · ${n.ic50_nM} nM · Tanimoto ${n.tanimoto.toFixed(2)}`).join(' | ')}</div><p class="callout" style="margin-top:10px">${d.warning}</p></div>`}catch(e){box.innerHTML=`<div class="callout" style="margin-top:10px">${esc(e.message)}</div>`}}
function genomicsPage(){return `${head('Pharmacogenomics · evidence boundary','A gene context is not a pharmacogenomic association.','KAPPA connects a human protein target identifier to its gene/protein identity. No patient-level variants, genotype–response associations or population-specific claims are asserted for the pilot.')}<div class="grid twocol"><div class="card"><h2>Target identity</h2><div class="sub">Cross-reference layer</div><div class="feature"><span>Gene symbol</span><b>PTGS2</b></div><div class="feature"><span>Protein</span><b>Prostaglandin G/H synthase 2 (COX-2)</b></div><div class="feature"><span>UniProt accession</span><b>P35354</b></div><div class="feature"><span>ChEMBL target ID</span><b>CHEMBL230 · Homo sapiens</b></div><div class="feature"><span>Source record</span><a class="muted" href="/api/genomic-context">UniProt P35354 · cached JSON evidence</a></div><p class="footer-note">Protein/gene identifiers are target annotation, not genetic evidence for disease or drug response.</p></div><div class="card"><h2>Separate, verified PGx demonstration</h2><div class="sub">CPIC / ClinPGx CYP2C19–clopidogrel evidence · unrelated to the plant/curcumin model</div><div id="pgxEvidence" class="empty">Loading cached CPIC evidence…</div></div></div><div class="callout" style="margin-top:14px">No individual genotype or treatment response is entered or predicted. The CYP2C19–clopidogrel example is a separate published guideline demonstration, not an association for curcumin/PTGS2 and not a patient recommendation.</div><div class="card" style="margin-top:14px"><h2>Next integration pathway</h2><p class="muted">A future data connector should version and cite UniProt, GWAS Catalog, Ensembl and/or Open Targets records, preserve evidence scores and study ancestry metadata, and separate association from causal interpretation. License and release conditions must be checked for each resource before redistribution.</p></div>`}
function mlPage(){let rf=overview.metrics?.primary_models?.['Random forest']||{},lr=overview.metrics?.primary_models?.['Logistic regression']||{};return `${head('Machine-learning laboratory','A real model, a deliberately narrow question.','Can molecular fingerprints and simple physicochemical features distinguish strong from weak measured human PTGS2 biochemical IC₅₀ records across held-out Bemis–Murcko scaffolds?')}<div class="grid stats">${metricCard('Curated labels',overview.records||'—','After filters; measurement records')}${metricCard('Scaffold holdout',overview.metrics?.test_n||'—','Exact structures deduplicated first')}${metricCard('Random forest ROC-AUC',rf.roc_auc?.toFixed(3)||'—','Primary model')}${metricCard('Scaffold CV folds',overview.metrics?.cross_validation_training_scaffold_group?.['Random forest']?.length||'—','Training partition; ROC-AUC')}</div><div class="grid twocol"><div class="card"><h2>Held-out test results</h2><div class="sub">Single scaffold holdout · threshold 0.5</div><div class="tablewrap"><table><thead><tr><th>Model</th><th>ROC-AUC</th><th>PR-AUC</th><th>Precision</th><th>Recall</th><th>F1</th><th>Balanced acc.</th><th>MCC</th></tr></thead><tbody>${Object.entries(overview.metrics?.primary_models||{}).map(([n,m])=>`<tr><td>${n}</td><td>${m.roc_auc.toFixed(3)}</td><td>${m.pr_auc.toFixed(3)}</td><td>${m.precision_at_0_5.toFixed(3)}</td><td>${m.recall_at_0_5.toFixed(3)}</td><td>${m.f1_at_0_5.toFixed(3)}</td><td>${m.balanced_accuracy_at_0_5.toFixed(3)}</td><td>${m.matthews_corrcoef_at_0_5.toFixed(3)}</td></tr>`).join('')}</tbody></table></div><div style="margin-top:14px"><img src="/results/figures/model_comparison.png" style="width:100%;max-height:150px;object-fit:contain" alt="Model comparison"><img src="/results/figures/confusion_matrix.png" style="width:100%;max-height:170px;object-fit:contain" alt="Held-out scaffold test confusion matrix"></div></div><div class="card"><h2>Task & safeguards</h2><div class="feature"><span>Positive class</span><b>IC₅₀ ≤ 1,000 nM</b></div><div class="feature"><span>Negative class</span><b>IC₅₀ ≥ 10,000 nM</b></div><div class="feature"><span>Ambiguous grey band</span><b>1–10 µM excluded</b></div><div class="feature"><span>Primary split</span><b>Bemis–Murcko scaffold group</b></div><div class="feature"><span>Overall / test positive prevalence</span><b>${overview.active&&overview.records?(100*overview.active/overview.records).toFixed(1):'—'}% / ${(100*(overview.metrics?.test_active_prevalence||0)).toFixed(1)}%</b></div><div class="callout" style="margin-top:12px">Imbalanced held-out set: high PR-AUC partly reflects majority class prevalence. Balanced accuracy is more modest. Test set is one split; uncertainty intervals and external validation remain future work.</div></div></div><div class="grid twocol" style="margin-top:14px"><div class="card"><h2>Global model explanation</h2><div class="sub">Held-out grouped permutation importance · ROC-AUC drop</div><img src="/results/figures/feature_importance.png" style="width:100%;max-height:260px;object-fit:contain" alt="Grouped permutation importance"></div><div class="card"><h2>Interpretation boundary</h2><p class="muted">This is model-behaviour explanation, not proof of mechanism. Morgan fingerprint bits are assessed as one block. Local outputs provide nearest measured training examples, molecular descriptors, similarity and exact-compound overlap, rather than SHAP values. A perturbation/explanation is not causal evidence.</p></div></div><div class="grid twocol" style="margin-top:14px"><div class="card"><h2>Calibration and training-only sensitivity</h2><div class="feature"><span>RF 10-bin ECE</span><b>${overview.metrics?.calibration_diagnostics?.['Random forest']?.expected_calibration_error_10_equal_width_bins?.toFixed(3)||'—'}</b></div><div class="feature"><span>RF Brier skill vs prevalence</span><b>${overview.metrics?.calibration_diagnostics?.['Random forest']?.brier_skill_vs_train_prevalence_constant?.toFixed(3)||'—'}</b></div><p class="footer-note">Probabilities remain uncalibrated; diagnostics are descriptive, not guarantees.</p><img src="/results/figures/calibration_diagnostics.png" style="width:100%;max-height:200px;object-fit:contain" alt="Uncalibrated reliability and prediction distribution"></div><div class="card"><h2>Internal stress tests · not external validation</h2><div class="feature"><span>Document-held-out RF ROC-AUC</span><b>${overview.metrics?.publication_and_scaffold_disjoint_stress_test?.random_forest?.roc_auc?.toFixed(3)||'—'}</b></div><div class="feature"><span>Temporal / scaffold-disjoint RF ROC-AUC</span><b>${overview.metrics?.temporal_and_scaffold_disjoint_stress_test?.random_forest?.roc_auc?.toFixed(3)||'—'}</b></div><div class="feature"><span>Applicability reference threshold</span><b>${overview.metrics?.ad_diagnostics?.threshold?.toFixed(3)||'—'} max Tanimoto</b></div><img src="/results/figures/model_sensitivity.png" style="width:100%;max-height:200px;object-fit:contain" alt="Training-only hyperparameter sensitivity"></div></div>`}
async function loadPgxEvidence(){let root=$('#pgxEvidence');if(!root)return;try{let d=await fetch('/api/pharmacogenomics').then(r=>r.json());let g=d.guideline,a=d.allele,p=d.pair,v=d.clinvar?.record?.variation_set?.[0],rs=v?.variation_xrefs?.find(x=>x.db_source==='dbSNP')?.db_id;root.innerHTML=`<div class="feature"><span>Gene / drug pair</span><b>${esc(p.genesymbol)} – ${esc(d.drug.name)}</b></div><div class="feature"><span>Curated star allele</span><b>${esc(a.name)} · ${esc(a.clinicalfunctionalstatus)}</b></div><div class="feature"><span>Variant identity (ClinVar)</span><b>rs${esc(rs)} · ${esc(v?.cdna_change)} · ${esc(d.clinvar?.record?.accession)}</b></div><div class="feature"><span>ClinVar germline label</span><b>${esc(d.clinvar?.record?.germline_classification?.description||'n/a')} · evaluated ${esc(d.clinvar?.record?.germline_classification?.last_evaluated||'n/a')}</b></div><div class="feature"><span>Pair evidence tiers</span><b>CPIC ${esc(p.cpiclevel)} · ClinPGx ${esc(p.clinpgxlevel)}</b></div><div class="feature"><span>Guideline</span><a class="muted" href="${esc(g.url)}" target="_blank" rel="noreferrer">${esc(g.name)} · ${esc(g.clinpgxid)}</a></div><div class="sub" style="margin-top:12px">Phenotype-conditioned CPIC entries for ACS/PCI context (published guideline data; not advice for a person)</div><div class="tablewrap"><table><thead><tr><th>Phenotype</th><th>Classification</th><th>Guideline text</th></tr></thead><tbody>${d.recommendations.map(r=>`<tr><td>${esc(r.phenotypes?.CYP2C19)}</td><td>${esc(r.classification)}</td><td style="white-space:normal">${esc(r.drugrecommendation)}</td></tr>`).join('')}</tbody></table></div><div class="footer-note">CPIC citations: PMID ${esc((p.citations||[]).join(', '))}. ClinVar ${esc(d.clinvar?.record?.accession)} is used only for the molecular alias rs${esc(rs)} / ${esc(v?.cdna_change)} ↔ *2; its ClinVar germline label (\'Likely benign; other\', not-specified trait) is a disease-association classification, not a drug-response call. CPIC function/recommendations are separate. One allele is not a diplotype; no patient genotype is represented.</div><div class="callout" style="margin-top:10px">${esc(d.scope_note)}</div>`}catch(e){root.textContent='CPIC evidence cache unavailable: '+e.message}}
function graphPage(){return `${head('Knowledge graph · traceable edges','Inspect the evidence network.','A NetworkX graph offers separate plant/assay and pharmacogenomic subgraphs. Every edge is typed and annotated with a source; the CYP2C19 guideline component is intentionally disconnected from the phytochemical pilot.')}<div class="card"><div class="row"><div><h2>Evidence graph</h2><div class="sub">Choose a provenance-separated subgraph; click a node for source metadata.</div></div><select id="graphScope" onchange="loadGraph()"><option value="pilot">Plant & assay pilot</option><option value="pharmacogenomics">Independent CPIC PGx demo</option><option value="all">All (disconnected components)</option></select><button class="button secondary" onclick="loadGraph()">Reload</button></div><div class="graphbox" id="graph"></div><div id="graphinfo" class="footer-note">Click a node to inspect its source and scope.</div></div><div class="callout" style="margin-top:12px">Graph display is a connected evidence map, not an inferred causal network. Model-scored compound-to-target links are explicitly marked as predictions rather than measured associations.</div>`}
async function loadGraph(){let scope=$('#graphScope')?.value||'pilot';let d=await fetch('/api/graph?scope='+encodeURIComponent(scope)).then(r=>r.json()), svg=$('#graph'), w=svg.clientWidth||850,h=svg.clientHeight||400;let ns=d.nodes;let ids=new Set(ns.map(n=>n.id));let es=(d.edges||[]).filter(e=>ids.has(e.source)&&ids.has(e.target));let cx=w/2,cy=h/2;ns.forEach((n,i)=>{let a=(i/ns.length)*2*Math.PI;n.x=cx+Math.cos(a)*(w*.39);n.y=cy+Math.sin(a)*(h*.34)});let colors={plant:'#63dfa9',compound:'#82dbe9',target:'#dbc783',prediction:'#df9c84'};svg.innerHTML=`<svg viewBox="0 0 ${w} ${h}"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#608275"/></marker></defs>${es.map(e=>{let a=ns.find(n=>n.id===e.source),b=ns.find(n=>n.id===e.target);return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#4a7162" stroke-width="1.3" marker-end="url(#arr)"/><text x="${(a.x+b.x)/2}" y="${(a.y+b.y)/2-4}" fill="#9bb4a8" font-size="8" text-anchor="middle">${esc(e.relation)}</text>`}).join('')}${ns.map(n=>`<g onclick="graphNode('${esc(n.id)}')" style="cursor:pointer"><circle cx="${n.x}" cy="${n.y}" r="${n.kind==='plant'?18:13}" fill="${colors[n.kind]||'#78c6af'}" fill-opacity=".17" stroke="${colors[n.kind]||'#78c6af'}"/><text x="${n.x}" y="${n.y+29}" fill="#d5e9df" font-size="9" text-anchor="middle">${esc(n.label).slice(0,32)}</text></g>`).join('')}</svg>`;window.graphNodes=ns}
window.graphNode=id=>{let n=window.graphNodes.find(x=>x.id===id);$('#graphinfo').innerHTML=`<b>${esc(n.label)}</b> · ${esc(n.kind)} · Source: ${esc(n.source||'Not specified')}`};
function rankPage(){return `${head('Evidence-aware prioritisation','Rank with evidence, not false precision.','Evidence axes remain separate. Only the uncalibrated model probability is used for within-domain triage; identity, occurrence, activity records and PGx context are never blended into an arbitrary composite.')}<div class="grid twocol"><div class="card"><h2>Score a candidate</h2><div class="sub">Enter SMILES to inspect the uncalibrated activity estimate, applicability and separate evidence axes.</div><textarea id="rankSmiles" rows="3" style="width:100%">CC(=O)CC(=O)c1ccc(O)c(OC)c1</textarea><div class="row" style="margin-top:9px"><button class="button" onclick="rankCandidate()">Assess candidate</button><button class="button secondary" onclick="$('#rankSmiles').value='COc1cc(/C=C/C(=O)CC(=O)/C=C/c2ccc(O)c(OC)c2)ccc1O'">Use curcumin-like input</button></div><div id="rankResult"></div></div><div class="card"><h2>Transparent scoring rules</h2><div class="feature"><span>Activity estimate</span><b>uncalibrated RF probability</b></div><div class="feature"><span>Applicability status</span><b>empirical reference-range gate</b></div><div class="feature"><span>Nearest similarity</span><b>diagnostic only; never a reward</b></div><div class="feature"><span>Identity / use / PGx</span><b>separate evidence, no score weights</b></div><div class="feature"><span>Missing evidence</span><b>explicitly listed; not negative</b></div><div class="callout" style="margin-top:12px">No composite utility score: the old equal-weight aggregate was scientifically misleading and has been removed. The only permitted triage value is uncalibrated assay-band probability, and only for structures inside the empirical similarity reference range.</div><div class="sub" style="margin-top:12px">Training-only scaffold-CV hyperparameter sensitivity</div><img src="/results/figures/model_sensitivity.png" alt="Model hyperparameter sensitivity" style="width:100%;max-height:190px;object-fit:contain"></div></div>`}
async function rankCandidate(){let box=$('#rankResult');box.innerHTML='';try{let r=await fetch('/api/predict',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({smiles:$('#rankSmiles').value})});let d=await r.json();if(!r.ok)throw Error(d.detail);let s=d.score;box.innerHTML=`<div class="card" style="margin-top:12px"><div class="eyebrow">Model-only triage</div><div class="stat">${s.candidate_priority_score===null?'Not rankable':s.candidate_priority_score.toFixed(3)}</div><div class="sub">Uncalibrated activity-band probability is not a composite evidence score or clinical estimate.</div><div class="feature"><span>Model activity estimate</span><b>${(d.probability_active*100).toFixed(1)}% · uncalibrated</b></div><div class="feature"><span>Applicability</span><b>${esc(s.applicability_domain.status)} · Tanimoto ${d.max_training_similarity.toFixed(3)}</b></div><div class="feature"><span>Chemical identity</span><b>${esc(s.chemical_identity.status)}</b></div><div class="feature"><span>Measured PTGS2 evidence</span><b>${esc(s.observed_bioactivity.status)}${s.observed_bioactivity.ic50_nM?` · IC₅₀ ${s.observed_bioactivity.ic50_nM} nM · activity ${s.observed_bioactivity.activity_id}`:''}</b></div><div class="feature"><span>PGx evidence</span><b>${esc(s.pharmacogenomic_evidence.status)}</b></div><div class="feature"><span>Ethnobotanical context</span><b>${esc(s.ethnobotanical_evidence.status)}</b></div><div class="sub" style="margin-top:10px">Missing / unlinked:</div><ul>${s.missing_evidence.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="callout" style="margin-top:10px">${esc(s.score_basis)} ${esc(d.warning)}</p></div>`}catch(e){box.innerHTML=`<p class="callout">${esc(e.message)}</p>`}}
function methodsPage(){return `${head('Methods · provenance · reproducibility','Every score comes with a scope boundary.','This pilot deliberately prioritises a reproducible end-to-end experiment over broad but weakly supported multi-omic claims.')}<div class="grid twocol"><div class="card"><h2>Data & retrieval</h2><div class="feature"><span>Bioactivity</span><b>ChEMBL REST · CHEMBL230</b></div><div class="feature"><span>Retrieval</span><b>${overview.metrics?.retrieved_activity_count_total||'7,482'} IC₅₀ records · API cache</b></div><div class="feature"><span>Curated labels</span><b>≤1 µM active; ≥10 µM inactive</b></div><div class="feature"><span>Exclusions</span><b>non-exact, duplicate, flagged, non-protein assays; grey band</b></div><div class="feature"><span>Model features</span><b>7 descriptors + 512-bit Morgan r=2</b></div><div class="feature"><span>Split</span><b>Bemis–Murcko scaffold-group holdout · seed 17</b></div><div class="feature"><span>Train / test</span><b>2,462 / 702 structures</b></div><div class="feature"><span>Validation</span><b>training-only StratifiedGroupKFold · 3 folds</b></div><div class="feature"><span>Calibration</span><b>none applied · Brier 0.128 · ECE 0.120</b></div><div class="feature"><span>Stress tests</span><b>document-held-out and temporal / scaffold-disjoint (internal)</b></div><div class="feature"><span>Applicability reference</span><b>0.324 max training Tanimoto · empirical only</b></div><div class="feature"><span>Reproduction</span><b>python -m src.run_pipeline</b></div></div><div class="card"><h2>Provenance & limitation</h2><p><b>Bioactivity:</b> ChEMBL web services, activity records carry assay/document/activity identifiers. Data redistribution remains subject to ChEMBL's current terms; cached project extract is for reproducibility and attribution, review terms before reuse.</p><p><b>Plant evidence:</b> Wikidata P703 links Q312266 to Q42562 as occurrence only. A separate Velayudhan et al. (2012) secondary-use report cites a Malayalam book not independently accessed and identifies no specific community/locality; it is not efficacy. No LOTUS bulk snapshot is ingested.</p><p><b>PGx example:</b> independent CPIC CYP2C19–clopidogrel evidence, with phenotype/population-filtered recommendations; ClinVar c.681G&gt;A / rs4244285 is an identity cross-reference only; its cached germline label ('Likely benign; other', not-specified trait) is a disease-association call, not drug-response evidence, and it is not used to contradict CPIC's 'no function' allele assignment. No patient data or link to curcumin/PTGS2.</p><p><b>Compound identity:</b> PubChem CID 969516 and ChEMBL CHEMBL1184 as lookup identifiers for curcumin; structure can depend on tautomer/stereochemistry handling.</p><p><b>Target identity:</b> UniProt P35354 and ChEMBL CHEMBL230. The independent CPIC demonstration is not a PTGS2 or curcumin relationship.</p><p class="footer-note">See docs/provenance_register.md, docs/data_provenance.md and docs/validation_report.md for the source and validation audit.</p></div></div><div class="card" style="margin-top:14px"><h2>Reproducibility metadata</h2><pre>${esc(JSON.stringify({seed:overview.metrics?.seed,split:overview.metrics?.split,n_active:overview.active,n_inactive:overview.inactive,test_active_prevalence:overview.metrics?.test_active_prevalence,cross_validation_rf_roc_auc:overview.metrics?.cross_validation_training_scaffold_group?.['Random forest']?.map(x=>x.roc_auc),external_validation:overview.metrics?.external_validation},null,2))}</pre><a href="/docs/validation_report.md" class="button secondary">View validation report</a> <a href="/api/metrics" class="button secondary">JSON metrics</a> <a href="/api/data-quality" class="button secondary">Data quality audit</a></div>`}
function render(page){let [label,fn]=views[page]||views.overview;$('#crumb').textContent=label;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===page));$('#view').innerHTML=fn();if(page==='compounds'){fillTable();if(typeof compoundRows!=='undefined'&&compoundRows.length){inspect(0)}$('#search').oninput=e=>fillTable(e.target.value);$('#smiles').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();predict()}})}if(page==='rank'){$('#rankSmiles').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();rankCandidate()}})}if(page==='graph')loadGraph();if(page==='genomics')loadPgxEvidence()}
document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>render(n.dataset.page));loadData();
</script></body></html>
